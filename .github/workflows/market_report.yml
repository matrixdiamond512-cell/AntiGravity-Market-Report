name: Auto Market Report Generator

on:
  schedule:
    # JST 07:00 (UTC 22:00 prev day)
    - cron: '0 22 * * *'
    # JST 12:00 (UTC 03:00)
    - cron: '0 3 * * *'
    # JST 16:00 (UTC 07:00)
    - cron: '0 7 * * *'
    # JST 21:00 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python scripts/update_report.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update market report via GitHub Actions [skip ci]"
            git push
          fi
