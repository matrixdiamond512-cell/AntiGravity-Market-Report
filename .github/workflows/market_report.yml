name: Auto Market Report Generator (Self-Healing)

on:
  schedule:
    # 毎時15分おきに常時チェック (24時間無休)
    # 定時（07:00, 12:00, 16:00, 21:00）で未更新があれば即座に自動生成・配信
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python scripts/update_report.py

      - name: Commit and Push Changes Safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit (Report is up-to-date)"
          else
            git commit -m "Auto update market report via GitHub Actions [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
