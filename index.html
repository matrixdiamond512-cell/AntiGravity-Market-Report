<!DOCTYPE html>
<html lang="ja">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相場の見通しレポート 過去一覧 | ANTIGRAVITY AI ARCHIVE</title>
  <meta name="description" content="AI-MRMS 定時マーケットレポートのアーカイブ一覧ページ。日々の株式・為替・債券・コモディティの相場見通しを配信。">
  <link rel="stylesheet" href="style.css?v=20260727_v6">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">ANTIGRAVITY AI ARCHIVE</div>
      <h1 class="title">相場の見通しレポート 過去一覧</h1>
      <p class="subtitle">AI-MRMS 自動作成マーケットレポート アーカイブ</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="キーワード検索 (例: 原油, 日経平均, 金利, FOMC)...">
    </div>

    <main>
      <div id="reportList" class="report-list">
        <!-- JSでレポートカードが動的に挿入されます -->
      </div>
    </main>
  </div>

  <div id="reportModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" aria-label="閉じる">&times;</button>
      <div class="modal-header">
        <span id="modalTag" class="badge">--</span>
        <h2 id="modalTitle" class="modal-title">--</h2>
      </div>
      
      <div id="modalMarketData" style="margin-bottom: 1.5rem;"></div>
      <div id="modalFullText" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js?v=fc2aa333?v=20260727_v6"></script>
</body>
</html>
